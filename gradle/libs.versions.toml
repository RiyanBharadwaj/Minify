# LibreCuts (:videoeditor) dependencies. Compose aliases use the shared BOM
# (androidx-compose-bom) declared above; view-system libs are versioned here.
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
